apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

/**
 * Version name — read from `package.json`, which is the single source of truth.
 *
 * It used to be duplicated here, and the copies drifted: v1.0.0 shipped with
 * `package.json` saying 0.1.0, this file saying "1.0" and the git tag saying
 * v1.0.0, all naming the same release. Aligning them by hand fixed that
 * instance; reading one from the other removes the class of problem, since
 * there is no longer a second place to forget.
 *
 * Gradle parses `package.json` directly rather than a script stamping this
 * file, so nothing is generated, nothing needs regenerating after `cap sync`,
 * and opening the project in Android Studio needs no prior npm step.
 *
 * It FAILS LOUDLY if the version cannot be read. A silent fallback would let a
 * release build out the door labelled with a placeholder — precisely the kind
 * of quiet wrongness this change exists to end.
 */
def packageJsonFile = rootProject.file("../package.json")
if (!packageJsonFile.exists()) {
    throw new GradleException("Cannot resolve versionName: ${packageJsonFile} not found.")
}
def appVersionName = new JsonSlurper().parse(packageJsonFile).version
if (!appVersionName) {
    throw new GradleException("Cannot resolve versionName: no \"version\" field in ${packageJsonFile}.")
}

/**
 * Release signing (publishing).
 *
 * The keystore and its passwords live in `android/keystore.properties`, which
 * is git-ignored and NEVER committed. Signing material in a public AGPL repo
 * would let anyone ship an APK that Android accepts as an update to this app.
 *
 * Absent that file, the release build still CONFIGURES and COMPILES — it just
 * comes out unsigned, so a missing keystore fails at the point of publishing
 * rather than breaking every developer's build. See docs/RELEASING.md.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.nitidoc.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nitidoc.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /*
         * `versionCode` stays HAND-WRITTEN, and deliberately so. Deriving it
         * from the semver (the usual major*10000 + minor*100 + patch) looks
         * tidy and takes away a capability that is occasionally needed: Play
         * rejects a re-used code, so shipping a second build of the SAME
         * version — a rejected upload, a packaging fix with no code change —
         * would become impossible without inventing a version bump to carry it.
         *
         * It also only ever goes up. Adopting a formula would jump this to
         * 10000 with no way back, on the strength of a guess about future
         * needs.
         *
         * So: bump it by hand on every upload to Play, which rejects a re-used
         * one. The published v1.0.1 release uses 3, so this release is 4 — independently of
         * `versionName`, which now comes from `package.json`.
         * See docs/RELEASING.md.
         */
        versionCode 4
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            // Left off deliberately: the app is one WebView activity plus two
            // Capacitor plugins, so shrinking saves almost nothing, while an
            // over-eager rule stripping a plugin's reflected entry point is a
            // real and hard-to-debug risk. Revisit only with a measured reason.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
